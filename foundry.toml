[profile.default]
src = "src"
out = "out"
libs = ["lib"]
test = "test/unit"
solc_version = "0.8.24"
fs_permissions = [{ access = "read-write", path = "./deployments" }]

[profile.mainnet]
src = "src"
out = "out"
libs = ["lib"]
eth_rpc_url = "eth_mainnet"
test = "test/mainnet"
solc_version = "0.8.24"
allow_internal_expect_revert = true
fs_permissions = [{ access = "read-write", path = "./deployments" }]

[rpc_endpoints]
eth_mainnet = "${ETH_MAINNET_RPC_URL}"
